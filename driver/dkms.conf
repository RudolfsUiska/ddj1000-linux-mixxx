PACKAGE_NAME="snd-usb-audio-ddj1000"
PACKAGE_VERSION="2.0"
# snd-usb-audio with a quirk for the Pioneer DJ / AlphaTheta DDJ-1000 (2b73:0020).
# prepare.sh fetches sound/usb for each kernel from kernel.org and patches it.
PRE_BUILD="prepare.sh ${kernelver}"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"
# DKMS runs CLEAN after PRE_BUILD, so it must not remove the prepared sources.
CLEAN="true"
BUILT_MODULE_NAME[0]="snd-usb-audio"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
