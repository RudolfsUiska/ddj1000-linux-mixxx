# WirePlumber 0.5: leave the DDJ-1000 sound card to Mixxx (direct ALSA).
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-AlphaTheta*DDJ-1000*" }
      { device.name = "~alsa_card.usb-Pioneer*DDJ-1000*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
